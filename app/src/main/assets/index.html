<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd8ff;font-family:system-ui,sans-serif}canvas{display:block}button{font:inherit}
#ui{position:fixed;inset:0;pointer-events:none}#bar{position:absolute;top:6px;left:6px;right:6px;display:flex;gap:5px;overflow-x:auto;padding:2px 2px 8px;pointer-events:auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}.b{border:0;border-radius:10px;padding:8px 10px;background:#ffffffe8;font-weight:700;box-shadow:0 2px 7px #0003;white-space:nowrap}.sel{outline:3px solid #222}
#joy{position:absolute;left:14px;bottom:14px;width:116px;height:116px;border:2px solid #fff;border-radius:50%;background:#0005;pointer-events:auto;touch-action:none}#knob{position:absolute;left:36px;top:36px;width:44px;height:44px;border-radius:50%;background:#fffd;border:1px solid white}
#actions{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}.act{width:76px;height:54px;border:2px solid white;border-radius:14px;background:#0008;color:white;font-weight:800}.jump{height:76px;border-radius:50%}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:26px;text-shadow:0 1px 3px #000;pointer-events:none}.hint{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);background:#111a;color:#fff;border-radius:10px;padding:5px 9px;font-size:11px;white-space:nowrap}.heart{position:absolute;left:50%;top:48%;font-size:28px;animation:h .8s forwards}@keyframes h{to{opacity:0;transform:translateY(-80px) scale(1.3)}}
</style></head><body><div id="ui"><div id="bar"></div><div id="joy"><div id="knob"></div></div><div id="actions"><button id="use" class="act">USE</button><button id="jump" class="act jump">JUMP</button></div><div id="cross">＋</div><div class="hint">Stick: move · Drag: look · Tap: build/interact</div><div id="hearts"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
const U=1.5,W=64,L=W*U/2,EYE=U*1.7;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd8ff);
const cam=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.08,120);
const ren=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio||1,1.5));document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x557044,2.5));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(7,12,5);scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(W*U,.18,W*U),new THREE.MeshLambertMaterial({color:0x75bb63}));ground.position.y=-.09;ground.userData.ground=1;scene.add(ground);const grid=new THREE.GridHelper(W*U,W,0x315b32,0x315b32);grid.position.y=.01;scene.add(grid);

const palette=[['grass','🌱'],['wood','🪵'],['stone','🪨'],['brick','🧱'],['white','⬜'],['black','⬛'],['red','🟥'],['orange','🟧'],['yellow','🟨'],['green','🟩'],['blue','🟦'],['purple','🟪'],['pink','🩷'],['cyan','💠'],['lime','🟢'],['brown','🟫'],['glass','🪟'],['water','💧'],['sand','🏖️'],['door','🚪'],['stairs','🪜'],['roof','🏠'],['window','Window'],['fence','🚧'],['bed','🛏️'],['chair','🪑'],['table','Table'],['couch','🛋️'],['fridge','Fridge'],['sink','Sink'],['stove','Stove'],['counter','Counter'],['tv','📺'],['lamp','💡'],['toilet','🚽'],['bathtub','🛁'],['bookshelf','📚'],['fireplace','🔥'],['rug','Rug'],['plant','🪴'],['tree','🌳'],['chicken','🐔'],['pig','🐷'],['sheep','🐑'],['cow','🐄'],['cat','🐱'],['dog','🐶']];
const solidColors={grass:0x69b650,wood:0xa36b3d,stone:0x8c9298,brick:0xb85d4e,white:0xf4f4f0,black:0x222222,red:0xd84a48,orange:0xe98a3a,yellow:0xf2d64f,green:0x43a85b,blue:0x4386d8,purple:0x8758bd,pink:0xe889b3,cyan:0x55cbd3,lime:0x9acd45,brown:0x76513a,glass:0x9bdcf1,water:0x4696db,sand:0xe4cb83};
const mats={};for(const k in solidColors)mats[k]=new THREE.MeshLambertMaterial({color:solidColors[k],transparent:k==='glass'||k==='water',opacity:k==='glass'?.42:k==='water'?.7:1});
const cubeGeo=new THREE.BoxGeometry(U,U,U),blocks=[],animals=new Set(['chicken','pig','sheep','cow','cat','dog']),seats=new Set(['chair','couch','bed']);
let selected='grass',removeMode=false,px=.75,pz=6.75,feet=0,vy=0,yaw=Math.PI,pitch=0,mx=0,my=0,onGround=true;

const bar=document.getElementById('bar');palette.forEach((p,i)=>{const b=document.createElement('button');b.className='b item'+(i?'':' sel');b.dataset.t=p[0];b.textContent=p[1]+' '+p[0];bar.appendChild(b)});
for(const [id,label] of [['remove','REMOVE'],['save','SAVE'],['load','LOAD'],['new','NEW']]){const b=document.createElement('button');b.className='b';b.id=id;b.textContent=label;bar.appendChild(b)}
bar.addEventListener('click',e=>{const b=e.target.closest('.item');if(!b)return;selected=b.dataset.t;removeMode=false;document.getElementById('remove').classList.remove('sel');document.querySelectorAll('.item').forEach(x=>x.classList.toggle('sel',x===b))});
document.getElementById('remove').onclick=e=>{removeMode=!removeMode;e.currentTarget.classList.toggle('sel',removeMode)};

function mat(c){return new THREE.MeshLambertMaterial({color:c})}function box(g,sx,sy,sz,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(sx*U,sy*U,sz*U),mat(c));m.position.set(x*U,y*U,z*U);g.add(m);return m}
function eyes(g,x=.1,y=.25,z=-.62){for(const sx of[-x,x]){box(g,.07,.09,.04,0x111111,sx,y,z);box(g,.024,.024,.018,0xffffff,sx-.014,y+.018,z-.026)}}
function makeModel(t){const g=new THREE.Group();
 if(t==='door'){box(g,.8,1.8,.12,0x9a683d,0,.4,0);box(g,.07,.07,.05,0xe0bc50,.28,.4,-.08)}
 else if(t==='window'){box(g,.95,1.1,.12,0x80512e,0,.08,0);box(g,.74,.9,.07,0x9bdcf1,0,.08,-.07)}
 else if(t==='fence'){box(g,1,.14,.14,0x8d5a32,0,.05,0);box(g,.14,.85,.14,0x704423,-.38,-.18,0);box(g,.14,.85,.14,0x704423,.38,-.18,0)}
 else if(t==='stairs'){box(g,1,.33,1,0x8c9298,0,-.34,0);box(g,1,.33,.67,0x8c9298,0,0,.16);box(g,1,.33,.34,0x8c9298,0,.34,.33)}
 else if(t==='roof'){const m=box(g,1.2,.25,1.2,0xb85d4e,0,0,0);m.rotation.z=Math.PI/4}
 else if(t==='bed'){box(g,1.8,.42,.9,0xc96f86,0,-.25,0);box(g,.42,.2,.72,0xffffff,-.57,.08,0)}
 else if(t==='chair'){box(g,.68,.2,.68,0xb47a45,0,-.08,0);box(g,.68,.82,.12,0x9b643a,0,.34,.28)}
 else if(t==='table'){box(g,1.3,.18,.8,0x8d5a32,0,.3,0);for(const x of[-.5,.5])for(const z of[-.28,.28])box(g,.12,.6,.12,0x704423,x,-.08,z)}
 else if(t==='couch'){box(g,1.7,.42,.76,0x7189aa,0,-.18,0);box(g,1.7,.68,.16,0x5d7391,0,.25,.3);box(g,.18,.55,.76,0x5d7391,-.76,.02,0);box(g,.18,.55,.76,0x5d7391,.76,.02,0)}
 else if(t==='fridge')box(g,.86,1.75,.75,0xe8ecee,0,.37,0);
 else if(['sink','stove','counter'].includes(t)){box(g,.9,.85,.85,0xd6d0c6,0,-.08,0);box(g,.92,.08,.88,t==='stove'?0x303030:t==='sink'?0x8da4ad:0xb28a63,0,.38,0)}
 else if(t==='tv'){box(g,1.25,.75,.12,0x242424,0,.18,0);box(g,.35,.1,.3,0x555555,0,-.26,0)}
 else if(t==='lamp'){box(g,.12,.8,.12,0x777777,0,-.1,0);box(g,.55,.4,.55,0xf2d78e,0,.45,0)}
 else if(t==='toilet'){box(g,.65,.45,.7,0xf5f5f0,0,-.2,0);box(g,.65,.75,.18,0xf5f5f0,0,.18,.25)}
 else if(t==='bathtub')box(g,1.6,.55,.8,0xf5f5f0,0,-.2,0);
 else if(t==='bookshelf'){box(g,1.1,1.7,.32,0x84562f,0,.3,0);for(const y of[-.15,.3,.75])box(g,.85,.18,.12,0xc84f45,0,y,-.18)}
 else if(t==='fireplace'){box(g,1.2,1.3,.45,0x8c6b58,0,.15,0);box(g,.65,.65,.1,0x242424,0,-.05,-.25);box(g,.35,.4,.06,0xf28a2e,0,-.05,-.32)}
 else if(t==='rug')box(g,1.6,.06,1,0xa45d79,0,-.47,0);
 else if(t==='plant'){box(g,.52,.32,.52,0x8d5a32,0,-.32,0);box(g,.18,.55,.18,0x3f8f45,0,.05,0);box(g,.55,.16,.18,0x55aa55,0,.18,0);box(g,.18,.16,.55,0x4b9d4d,0,.32,0)}
 else if(t==='tree'){box(g,.35,1.3,.35,0x80512e,0,.15,0);box(g,1.1,.8,1.1,0x4a9b50,0,.85,0)}
 else if(animals.has(t)){const c={pig:0xefa7b3,cow:0xf2efe7,sheep:0xf5f0e8,cat:0xc28a58,dog:0xa9784c,chicken:0xf5f1df}[t];box(g,t==='chicken'?.55:.9,t==='chicken'?.55:.65,t==='chicken'?.5:.62,c,0,-.08,.05);box(g,.42,.42,.38,c,0,.18,-.44);eyes(g);
   if(t==='cow'){box(g,.3,.18,.12,0xe5a8a8,0,.08,-.68);box(g,.22,.18,.08,0x5b4435,-.24,.02,.08);box(g,.18,.16,.08,0x5b4435,.22,-.16,.12);box(g,.1,.15,.07,0xd6c29d,-.3,.48,-.37);box(g,.1,.15,.07,0xd6c29d,.3,.48,-.37)}
   if(t==='pig')box(g,.3,.17,.11,0xd87e90,0,.1,-.68);
   if(t==='cat'||t==='dog'){box(g,.15,.24,.08,0x80512e,-.16,.43,-.34);box(g,.15,.24,.08,0x80512e,.16,.43,-.34);box(g,.1,.08,.06,t==='cat'?0xe89aaa:0x2d211b,0,.1,-.64)}
   if(t==='chicken'){box(g,.16,.1,.2,0xe5a72f,0,.14,-.64);box(g,.1,.16,.08,0xd94d42,0,.43,-.3)}
   for(const x of[-.27,.27])for(const z of[-.18,.18])box(g,.12,.42,.12,t==='cow'?0x4d4038:c,x,-.47,z);
 } else return null;return g}
function facePlayer(b){b.rotation.y=Math.round(Math.atan2(px-b.position.x,pz-b.position.z)/(Math.PI/2))*(Math.PI/2)}
function isSolidType(t){return !['water','glass','rug','plant'].includes(t)}function isFullCubeType(t){return !!solidColors[t]}function snap(v){return Math.floor(v/U)*U+U/2}function occupied(x,y,z){return blocks.some(b=>Math.abs(b.position.x-x)<.01&&Math.abs(b.position.y-y)<.01&&Math.abs(b.position.z-z)<.01)}
function add(x,y,z,t=selected,save=true){x=snap(x);y=snap(y);z=snap(z);if(Math.abs(x)>L-U/2||Math.abs(z)>L-U/2||occupied(x,y,z))return;let b;if(solidColors[t])b=new THREE.Mesh(cubeGeo,mats[t]);else b=makeModel(t);if(!b)return;b.position.set(x,y,z);b.userData={block:1,type:t,solid:isSolidType(t)};b.traverse(o=>o.userData.owner=b);if(!solidColors[t])facePlayer(b);scene.add(b);blocks.push(b);if(save)saveGame(true)}
function erase(b){scene.remove(b);blocks.splice(blocks.indexOf(b),1);saveGame(true)}
function clear(){blocks.forEach(b=>scene.remove(b));blocks.length=0}
function state(){return {v:4,player:{px,pz,feet,yaw,pitch},blocks:blocks.map(b=>({x:b.position.x,y:b.position.y,z:b.position.z,type:b.userData.type,r:b.rotation.y}))}}
function saveGame(q=false){localStorage.setItem('roundBuilderSaveV4',JSON.stringify(state()))}
function loadGame(){try{const s=JSON.parse(localStorage.getItem('roundBuilderSaveV4'));if(!s)return false;clear();if(s.player){px=s.player.px;pz=s.player.pz;feet=s.player.feet||0;yaw=s.player.yaw||Math.PI;pitch=s.player.pitch||0}(s.blocks||[]).forEach(v=>{add(v.x,v.y,v.z,v.type,false);blocks[blocks.length-1].rotation.y=v.r||0});return true}catch(e){return false}}
window.saveGame=saveGame;document.getElementById('save').onclick=()=>saveGame();document.getElementById('load').onclick=()=>loadGame();document.getElementById('new').onclick=()=>{clear();px=.75;pz=6.75;feet=0;yaw=Math.PI;pitch=0;saveGame(true)};
if(!loadGame()){[[-2.25,.75,-2.25,'wood'],[-.75,.75,-2.25,'stone'],[.75,.75,-2.25,'brick']].forEach(v=>add(...v,false));saveGame(true)}

const ray=new THREE.Raycaster(),pt=new THREE.Vector2();function pick(e){const r=ren.domElement.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,cam);const h=ray.intersectObjects([ground,...blocks],true)[0];if(h&&h.object.userData.owner)h.owner=h.object.userData.owner;return h}
function hearts(){const h=document.getElementById('hearts');for(let i=0;i<4;i++){const d=document.createElement('div');d.className='heart';d.textContent=i%2?'💖':'💗';d.style.marginLeft=(Math.random()*40-20)+'px';d.style.animationDelay=i*.06+'s';h.appendChild(d);setTimeout(()=>d.remove(),950)}}
function interact(b){if(!b)return false;const t=b.userData.type;if(animals.has(t)){hearts();b.scale.set(1.07,.94,1.07);setTimeout(()=>b.scale.set(1,1,1),180);return true}if(seats.has(t)){px=b.position.x-Math.sin(b.rotation.y)*U*.6;pz=b.position.z-Math.cos(b.rotation.y)*U*.6;feet=Math.max(0,b.position.y-U/2);return true}return false}
let pid=null,sx=0,sy=0,lx=0,ly=0,drag=false;ren.domElement.style.touchAction='none';ren.domElement.addEventListener('pointerdown',e=>{pid=e.pointerId;sx=lx=e.clientX;sy=ly=e.clientY;drag=false;ren.domElement.setPointerCapture(e.pointerId)});ren.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;if(Math.hypot(e.clientX-sx,e.clientY-sy)>6)drag=true;if(drag){yaw-=dx*.0065;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.0065))}});ren.domElement.addEventListener('pointerup',e=>{if(e.pointerId!==pid)return;pid=null;if(drag)return;const h=pick(e);if(!h)return;const o=h.owner||h.object;if(o.userData.block&&interact(o))return;if(removeMode&&o.userData.block){erase(o);return}if(h.object.userData.ground)add(h.point.x,0,h.point.z);else{const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);add(o.position.x+n.x*U,o.position.y+n.y*U,o.position.z+n.z*U)}});

const J=document.getElementById('joy'),K=document.getElementById('knob');let jid=null;function joy(e){const r=J.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy,max=35,l=Math.hypot(dx,dy),f=l>max?max/l:1;dx*=f;dy*=f;mx=dx/max;my=dy/max;K.style.left=(36+dx)+'px';K.style.top=(36+dy)+'px'}function stop(){jid=null;mx=my=0;K.style.left='36px';K.style.top='36px'}J.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;J.setPointerCapture(e.pointerId);joy(e)});J.addEventListener('pointermove',e=>{if(e.pointerId===jid)joy(e)});J.addEventListener('pointerup',stop);J.addEventListener('pointercancel',stop);
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(onGround){vy=U*.17;onGround=false}});
document.getElementById('use').addEventListener('pointerdown',e=>{e.preventDefault();ray.setFromCamera(new THREE.Vector2(0,0),cam);const h=ray.intersectObjects(blocks,true)[0];if(h&&h.distance<U*3)interact(h.object.userData.owner||h.object)});

function collidesAt(x,z,feetY){
  const r=U*.28;
  for(const b of blocks){
    if(!b.userData.solid)continue;
    const halfX=(b.userData.type==='couch'||b.userData.type==='bed'||b.userData.type==='bathtub'||b.userData.type==='table')?U*.75:U*.48;
    const halfZ=(b.userData.type==='couch'||b.userData.type==='bed'||b.userData.type==='bathtub'||b.userData.type==='table')?U*.5:U*.48;
    const bottom=b.position.y-U*.5, top=b.position.y+U*.9;
    if(feetY<top && feetY+EYE>bottom && Math.abs(x-b.position.x)<halfX+r && Math.abs(z-b.position.z)<halfZ+r)return true;
  }
  return false
}
function floorHeight(x,z){let best=0;for(const b of blocks){if(!b.userData.solid)continue;if(Math.abs(x-b.position.x)<U*.43&&Math.abs(z-b.position.z)<U*.43){const top=b.position.y+U/2;if(top<=feet+U*.7&&top>best)best=top}}return best}
function loop(){requestAnimationFrame(loop);const sp=U*.05,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);const dx=(-my*fx+mx*rx)*sp,dz=(-my*fz+mx*rz)*sp;let nx=Math.max(-L+U/2,Math.min(L-U/2,px+dx));if(!collidesAt(nx,pz,feet))px=nx;let nz=Math.max(-L+U/2,Math.min(L-U/2,pz+dz));if(!collidesAt(px,nz,feet))pz=nz;vy-=U*.008;feet+=vy;const floor=floorHeight(px,pz);if(feet<=floor){feet=floor;vy=0;onGround=true}cam.position.set(px,feet+EYE,pz);cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;ren.render(scene,cam)}loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});addEventListener('pagehide',()=>saveGame(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(true)});
</script></body></html>
