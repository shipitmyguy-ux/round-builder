<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd8ff;font-family:sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#bar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.b{pointer-events:auto;border:0;border-radius:12px;padding:9px 12px;background:#ffffffdd;font-weight:700;box-shadow:0 2px 8px #0003}.sel{outline:3px solid #222}.danger{background:#ffd5d5}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#111b;color:white;border-radius:12px;padding:7px 12px;font-size:12px;white-space:nowrap}#status{margin-left:auto;background:#111b;color:white;padding:7px 10px;border-radius:10px;font-size:12px}
</style></head><body><div id="ui"><div id="bar"><button class="b mat sel" data-m="grass">Grass</button><button class="b mat" data-m="wood">Wood</button><button class="b mat" data-m="stone">Stone</button><button class="b mat" data-m="brick">Brick</button><button id="remove" class="b">Remove</button><button id="save" class="b">Save</button><button id="load" class="b">Load</button><button id="new" class="b danger">New World</button><span id="status">Ready</span></div><div class="hint">Tap: build · Double tap ground: move · Drag: look</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd8ff);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);let yaw=.72,pitch=.62,dist=13,target=new THREE.Vector3(0,0,0);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x58734b,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,4);scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(16,.35,16),new THREE.MeshLambertMaterial({color:0x78bd5d}));ground.position.y=-.2;ground.userData.ground=true;scene.add(ground);
const grid=new THREE.GridHelper(16,16,0x315b32,0x60995a);grid.position.y=.001;scene.add(grid);
const colors={grass:0x69b650,wood:0xa36b3d,stone:0x8c9298,brick:0xb85d4e};let material='grass',remove=false,blocks=[];
const geo=new THREE.BoxGeometry(1,1,1);
function addBlock(x,y,z,type='grass',autos=true){if(blocks.some(b=>b.position.x===x&&b.position.y===y&&b.position.z===z))return;let b=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:colors[type]||colors.grass}));b.position.set(x,y,z);b.userData={block:true,type};scene.add(b);blocks.push(b);if(autos)saveGame(true)}
function clearBlocks(){blocks.forEach(b=>scene.remove(b));blocks=[]}
const char=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(.42,24,16),new THREE.MeshLambertMaterial({color:0xffe0a0}));body.scale.y=1.18;body.position.y=.5;char.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,24,16),body.material);head.position.y=1.08;char.add(head);scene.add(char);
function starter(){clearBlocks();char.position.set(0,0,2);[[-3,.5,-2,'wood'],[-3,1.5,-2,'wood'],[-3,2.5,-2,'grass'],[-2,2.5,-2,'grass'],[-4,2.5,-2,'grass'],[2,.5,-3,'stone'],[3,.5,-3,'stone'],[2,.5,-2,'stone']].forEach(v=>addBlock(...v,false))}
function state(){return {v:1,blocks:blocks.map(b=>({x:b.position.x,y:b.position.y,z:b.position.z,type:b.userData.type})),player:{x:char.position.x,y:char.position.y,z:char.position.z}}}
function saveGame(quiet=false){localStorage.setItem('roundBuilderSave',JSON.stringify(state()));if(!quiet)flash('Saved')}
window.saveGame=saveGame;
function loadGame(){try{let s=JSON.parse(localStorage.getItem('roundBuilderSave'));if(!s){flash('No save yet');return}clearBlocks();(s.blocks||[]).forEach(v=>addBlock(v.x,v.y,v.z,v.type,false));if(s.player)char.position.set(s.player.x||0,s.player.y||0,s.player.z||0);flash('Loaded')}catch(e){flash('Save error')}}
function flash(t){const e=document.getElementById('status');e.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>e.textContent='Ready',1200)}
if(localStorage.getItem('roundBuilderSave'))loadGame();else{starter();saveGame(true)}
document.querySelectorAll('.mat').forEach(x=>x.onclick=()=>{document.querySelectorAll('.mat').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');material=x.dataset.m;remove=false;document.getElementById('remove').classList.remove('sel')});
document.getElementById('remove').onclick=e=>{remove=!remove;e.currentTarget.classList.toggle('sel',remove)};
document.getElementById('save').onclick=()=>saveGame();document.getElementById('load').onclick=loadGame;document.getElementById('new').onclick=()=>{starter();saveGame(true);flash('New world')};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,drag=false,lastTap=0,lastObj=null,pending=null;
function hit(ev){let r=ren.domElement.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,cam);return ray.intersectObjects([ground,...blocks],false)[0]}
ren.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};drag=false;ren.domElement.setPointerCapture(e.pointerId)});
ren.domElement.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>7)drag=true;if(drag){yaw-=e.movementX*.008;pitch=Math.max(.2,Math.min(1.25,pitch+e.movementY*.008))}});
ren.domElement.addEventListener('pointerup',e=>{down=null;if(drag)return;const h=hit(e);if(!h)return;const now=Date.now(),isDouble=now-lastTap<340&&lastObj===h.object;clearTimeout(pending);if(isDouble&&h.object.userData.ground){char.position.set(Math.round(h.point.x),0,Math.round(h.point.z));saveGame(true);lastTap=0;lastObj=null;return}lastTap=now;lastObj=h.object;pending=setTimeout(()=>{if(h.object.userData.block&&remove){scene.remove(h.object);blocks=blocks.filter(b=>b!==h.object);saveGame(true);return}let p;if(h.object.userData.ground)p=new THREE.Vector3(Math.round(h.point.x),.5,Math.round(h.point.z));else{p=h.object.position.clone().add(h.face.normal);p.x=Math.round(p.x);p.y=Math.round(p.y);p.z=Math.round(p.z)}if(Math.abs(p.x)<=7&&Math.abs(p.z)<=7&&p.y>=.5&&p.y<=7.5)addBlock(p.x,p.y,p.z,material)},350)});
function camera(){cam.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist+1,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(target.x,target.y+1,target.z)}
function loop(){requestAnimationFrame(loop);target.x+=(char.position.x-target.x)*.05;target.z+=(char.position.z-target.z)*.05;camera();ren.render(scene,cam)}loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});addEventListener('pagehide',()=>saveGame(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(true)});
</script></body></html>
