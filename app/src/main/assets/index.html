<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd8ff;font-family:sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none}#bar{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:nowrap;align-items:center;overflow-x:auto;padding:3px 3px 9px;pointer-events:auto;scrollbar-width:none}#bar::-webkit-scrollbar{display:none}.b{pointer-events:auto;border:0;border-radius:12px;padding:9px 12px;background:#ffffffdd;font-weight:700;box-shadow:0 2px 8px #0003;flex:0 0 auto}.sel{outline:3px solid #222}.danger{background:#ffd5d5}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#111b;color:white;border-radius:12px;padding:7px 12px;font-size:12px;white-space:nowrap}#status{margin-left:auto;background:#111b;color:white;padding:7px 10px;border-radius:10px;font-size:12px}
</style></head><body><div id="ui"><div id="bar"><button class="b mat sel" data-m="grass">Grass</button><button class="b mat" data-m="wood">Wood</button><button class="b mat" data-m="stone">Stone</button><button class="b mat" data-m="brick">Brick</button><button class="b mat" data-m="water">Water</button><button class="b mat" data-m="plant">Plant</button><button class="b mat" data-m="bed">Bed</button><button class="b mat" data-m="chair">Chair</button><button class="b mat" data-m="table">Table</button><button class="b mat" data-m="glass">Glass</button><button class="b mat" data-m="sand">Sand</button><button class="b mat" data-m="flower">Flower</button><button class="b mat" data-m="lamp">Lamp</button><button id="remove" class="b">Remove</button><button id="save" class="b">Save</button><button id="load" class="b">Load</button><button id="new" class="b danger">New World</button><span id="status">Ready</span></div><div class="hint">Tap: build · Remove: delete · Drag: look</div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd8ff);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);let yaw=.72,pitch=.62,dist=13,target=new THREE.Vector3(0,0,0);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x58734b,2.2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,4);scene.add(dl);
const ground=new THREE.Mesh(new THREE.BoxGeometry(16,.35,16),new THREE.MeshLambertMaterial({color:0x78bd5d}));ground.position.y=-.2;ground.userData.ground=true;scene.add(ground);
const grid=new THREE.GridHelper(16,16,0x315b32,0x60995a);grid.position.y=.001;scene.add(grid);
const colors={grass:0x69b650,wood:0xa36b3d,stone:0x8c9298,brick:0xb85d4e,water:0x43a9e8,plant:0x3f8f45,bed:0xc96f86,chair:0xb47a45,table:0x8d5a32,glass:0xbcecff,sand:0xe6cf91,flower:0xe85b8a,lamp:0xffd45c};let material='grass',remove=false,blocks=[];
const geo=new THREE.BoxGeometry(1,1,1);
function part(g,c,x,y,z,parent){const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);parent.add(m);return m}
function makeObject(type){
 const g=new THREE.Group(), box=(sx,sy,sz,c,x,y,z)=>part(new THREE.BoxGeometry(sx,sy,sz),c,x,y,z,g);
 if(type==='flower'){box(.5,.28,.5,0x8d5a32,0,-.34,0);box(.12,.55,.12,0x3f8f45,0,.02,0);box(.22,.16,.22,0xe85b8a,0,.32,0);box(.12,.12,.12,0xffd45c,0,.34,0)}
 else if(type==='lamp'){box(.45,.12,.45,0x704423,0,-.38,0);box(.12,.72,.12,0x8d5a32,0,-.02,0);box(.52,.42,.52,0xffd45c,0,.32,0)}
 else if(type==='plant'){box(.52,.32,.52,0x8d5a32,0,-.32,0);box(.18,.55,.18,0x3f8f45,0,.05,0);box(.55,.16,.18,0x55aa55,0,.18,0);box(.18,.16,.55,0x4b9d4d,0,.32,0)}
 else if(type==='bed'){box(.9,.28,.95,0xa36b3d,0,-.28,0);box(.86,.24,.9,0xc96f86,0,.0,0);box(.72,.16,.32,0xf4f0df,0,.2,-.25)}
 else if(type==='chair'){box(.72,.18,.72,0xb47a45,0,-.02,0);box(.14,.55,.14,0x8d5a32,-.26,-.3,-.26);box(.14,.55,.14,0x8d5a32,.26,-.3,-.26);box(.14,.55,.14,0x8d5a32,-.26,-.3,.26);box(.14,.55,.14,0x8d5a32,.26,-.3,.26);box(.72,.68,.14,0xb47a45,0,.34,.29)}
 else if(type==='table'){box(.95,.18,.95,0x8d5a32,0,.25,0);[[-.34,-.25,-.34],[.34,-.25,-.34],[-.34,-.25,.34],[.34,-.25,.34]].forEach(p=>box(.14,.7,.14,0x704423,...p))}
 else return null;
 return g;
}
function addBlock(x,y,z,type='grass',autos=true){x=Math.round(x);y=Math.floor(y)+.5;z=Math.round(z);if(blocks.some(b=>b.position.x===x&&b.position.y===y&&b.position.z===z))return;let b=makeObject(type);if(!b){const transparent=type==='water'||type==='glass';b=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:colors[type]||colors.grass,transparent,opacity:type==='water'?.68:type==='glass'?.38:1}))}b.position.set(x,y,z);b.userData={block:true,type};b.traverse(o=>o.userData.owner=b);scene.add(b);blocks.push(b);if(autos)saveGame(true)}
function clearBlocks(){blocks.forEach(b=>scene.remove(b));blocks=[]}
function starter(){clearBlocks();[[-3,.5,-2,'wood'],[-3,1.5,-2,'wood'],[-3,2.5,-2,'grass'],[-2,2.5,-2,'grass'],[-4,2.5,-2,'grass'],[2,.5,-3,'stone'],[3,.5,-3,'stone'],[2,.5,-2,'stone']].forEach(v=>addBlock(...v,false))}
function state(){return {v:2,blocks:blocks.map(b=>({x:b.position.x,y:b.position.y,z:b.position.z,type:b.userData.type}))}}
function saveGame(quiet=false){localStorage.setItem('roundBuilderSave',JSON.stringify(state()));if(!quiet)flash('Saved')}
window.saveGame=saveGame;
function loadGame(){try{let st=JSON.parse(localStorage.getItem('roundBuilderSave'));if(!st){flash('No save yet');return}clearBlocks();(st.blocks||[]).forEach(v=>addBlock(v.x,v.y,v.z,v.type,false));flash('Loaded')}catch(e){flash('Save error')}}
function flash(t){const e=document.getElementById('status');e.textContent=t;clearTimeout(flash.t);flash.t=setTimeout(()=>e.textContent='Ready',1200)}
if(localStorage.getItem('roundBuilderSave'))loadGame();else{starter();saveGame(true)}
document.querySelectorAll('.mat').forEach(x=>x.onclick=()=>{document.querySelectorAll('.mat').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');material=x.dataset.m;remove=false;document.getElementById('remove').classList.remove('sel')});
document.getElementById('remove').onclick=e=>{remove=!remove;e.currentTarget.classList.toggle('sel',remove)};
document.getElementById('save').onclick=()=>saveGame();document.getElementById('load').onclick=loadGame;document.getElementById('new').onclick=()=>{starter();saveGame(true);flash('New world')};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null,drag=false,lastX=0,lastY=0;
function hit(ev){let r=ren.domElement.getBoundingClientRect();mouse.set((ev.clientX-r.left)/r.width*2-1,-(ev.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,cam);const h=ray.intersectObjects([ground,...blocks],true)[0];if(h&&h.object.userData.owner){h.owner=h.object.userData.owner}return h}
ren.domElement.style.touchAction='none';ren.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};lastX=e.clientX;lastY=e.clientY;drag=false;ren.domElement.setPointerCapture(e.pointerId)});
ren.domElement.addEventListener('pointermove',e=>{if(!down)return;const totalX=e.clientX-down.x,totalY=e.clientY-down.y,dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;if(Math.hypot(totalX,totalY)>7)drag=true;if(drag){yaw-=dx*.012;pitch=Math.max(.2,Math.min(1.25,pitch+dy*.012))}});
ren.domElement.addEventListener('pointerup',e=>{down=null;if(drag)return;const h=hit(e);if(!h)return;const owner=h.owner||h.object;if(owner.userData.block&&remove){scene.remove(owner);blocks=blocks.filter(b=>b!==owner);saveGame(true);return}let p;if(h.object.userData.ground)p=new THREE.Vector3(Math.round(h.point.x),.5,Math.round(h.point.z));else{p=owner.position.clone().add(h.face.normal);p.x=Math.round(p.x);p.y=Math.floor(p.y)+.5;p.z=Math.round(p.z)}if(Math.abs(p.x)<=7&&Math.abs(p.z)<=7&&p.y>=.5&&p.y<=7.5)addBlock(p.x,p.y,p.z,material)});
ren.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(6,Math.min(24,dist+Math.sign(e.deltaY)));},{passive:false});
function camera(){cam.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*dist,target.y+Math.sin(pitch)*dist+1,target.z+Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(target.x,target.y+1,target.z)}
function loop(){requestAnimationFrame(loop);camera();ren.render(scene,cam)}loop();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});addEventListener('pagehide',()=>saveGame(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(true)});
</script></body></html>
